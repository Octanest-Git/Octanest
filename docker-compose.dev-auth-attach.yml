# Attach the main `make up` API to Mailpit / OIDC mock / HTTP stubs.
#
# Prerequisites: stub services running (`make up-dev-auth` or included below).
#
# Usage:
#   make up-with-dev-auth
# Or:
#   docker compose -f docker-compose.yml \
#     -f docker-compose.dev-auth.yml \
#     -f docker-compose.dev-auth-attach.yml \
#     --profile dev-auth up --build -d
#
# Defaults wire SMTP → Mailpit over Docker DNS. Resend / WorkOS / OIDC stay
# optional via .env (see docs/dev-auth.env.compose.example).
#
# Docs: docs/dev-auth.md

services:
  mailpit:
    networks:
      - oxidean-dev-auth
      - oxidean

  stubs:
    networks:
      - oxidean-dev-auth
      - oxidean

  oidc-mock:
    networks:
      - oxidean-dev-auth
      - oxidean

  api:
    extra_hosts:
      # OIDC discovery from API container to published host port (:9090).
      # Docker Desktop resolves `host-gateway` magic; the `docker`→podman alias
      # needs the oxidean_dev_auth bridge gateway IP (auto-detected by
      # scripts/dev-auth/host-gateway-ip.sh and injected as OXIDEAN_HOST_GATEWAY_IP).
      - "host.docker.internal:${OXIDEAN_HOST_GATEWAY_IP:-host-gateway}"
    environment:
      # Traefik serves the app on :80 → http://localhost (not vite :3000).
      # Use OXIDEAN_COMPOSE_PUBLIC_ORIGIN so host `.env` OXIDEAN_PUBLIC_ORIGIN
      # for `make dev` does not rewrite magic-link hosts.
      OXIDEAN_PUBLIC_ORIGIN: ${OXIDEAN_COMPOSE_PUBLIC_ORIGIN:-http://localhost}
      OXIDEAN_MAIL_FROM: ${OXIDEAN_MAIL_FROM:-Oxidean <noreply@localhost>}
      # Prefer Compose-specific override so a host-oriented OXIDEAN_SMTP_URL=127.0.0.1
      # in `.env` (for `make dev`) does not break the API container.
      OXIDEAN_SMTP_URL: ${OXIDEAN_COMPOSE_SMTP_URL:-smtp://mailpit:1025}
      # Optional Resend stub (set OXIDEAN_RESEND_API_KEY=re_dev_local in .env to prefer Resend):
      OXIDEAN_RESEND_API_KEY: ${OXIDEAN_RESEND_API_KEY:-}
      OXIDEAN_RESEND_BASE_URL: ${OXIDEAN_COMPOSE_RESEND_BASE_URL:-http://stubs:9092}
      # Optional WorkOS stub — API hits stubs; browser authorize uses published port:
      WORKOS_API_KEY: ${WORKOS_API_KEY:-}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
      OXIDEAN_WORKOS_BASE_URL: ${OXIDEAN_COMPOSE_WORKOS_BASE_URL:-http://stubs:9092}
      OXIDEAN_WORKOS_AUTHORIZE_BASE_URL: ${OXIDEAN_WORKOS_AUTHORIZE_BASE_URL:-http://127.0.0.1:9092}
      # Optional OIDC mock — issuer via host gateway so API can reach published :9090.
      OXIDEAN_OIDC_ALLOW_INSECURE: ${OXIDEAN_OIDC_ALLOW_INSECURE:-1}
      OXIDEAN_OIDC_ISSUER: ${OXIDEAN_COMPOSE_OIDC_ISSUER:-http://${OXIDEAN_HOST_GATEWAY_IP:-host.docker.internal}:9090/default}
      OXIDEAN_OIDC_CLIENT_ID: ${OXIDEAN_OIDC_CLIENT_ID:-oxidean-dev}
      OXIDEAN_OIDC_CLIENT_SECRET: ${OXIDEAN_OIDC_CLIENT_SECRET:-oxidean-dev}

networks:
  oxidean:
    name: oxidean_oxidean
  oxidean-dev-auth:
    name: oxidean_dev_auth
