# bun:test config for apps/web (issue #37).
# Run via: bun test --cwd apps/web/bun-test  or Make targets test-bun-unit / bench-bun-unit.
# Do not write Chrome profiles or screenshots under this tree — use var/bun-test/.

[test]
# Unit tests only by default; browser files are opt-in via scripts/run-bun-webview.sh
# (parallel isolated processes) so Chrome is not shared across files.
root = "."
preload = ["./preload.ts"]
