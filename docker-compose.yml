# Default stack: Traefik + web + api + postgres (D-06, D-09)
# MySQL: docker compose -f docker-compose.yml -f docker-compose.mysql.yml --profile mysql up
# SQLite: see README — no DB service; set DATABASE_URL on api only

services:
  traefik:
    image: traefik:v3.3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=false
    ports:
      - "80:80"
    # podman machine: SELinux blocks socket bind-mount access inside containers;
    # `label=disable` is a no-op on Docker and enables socket reads on podman.
    security_opt:
      - label=disable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - octanest

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-octanest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-octanest}
      POSTGRES_DB: ${POSTGRES_DB:-octanest}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-octanest} -d ${POSTGRES_DB:-octanest}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - octanest

  api:
    build:
      context: .
      dockerfile: crates/octanest-api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://octanest:octanest@postgres:5432/octanest}
      OCTANEST_ENV: ${OCTANEST_ENV:-compose}
      OCTANEST_CORS_ORIGINS: ${OCTANEST_CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      # Browser-facing origin for magic links + SSO (Traefik :80). Prefer
      # OCTANEST_COMPOSE_PUBLIC_ORIGIN so a host `make dev` value of
      # OCTANEST_PUBLIC_ORIGIN=http://localhost:3000 in `.env` does not leak in.
      OCTANEST_PUBLIC_ORIGIN: ${OCTANEST_COMPOSE_PUBLIC_ORIGIN:-http://localhost}
      API_BIND: 0.0.0.0:8080
      OCTANEST_RPC_VERSION: ${OCTANEST_RPC_VERSION:-1}
      RUST_LOG: ${RUST_LOG:-info}
      # Absolute path required: API CWD is `/`; relative var/repos breaks seed push from /tmp worktrees.
      OCTANEST_REPOS_DIR: /var/repos
      # Git LFS object store (D-LFS-01 / GIT-13) — absolute like REPOS_DIR.
      OCTANEST_LFS_DIR: /var/lfs
      OCTANEST_RELEASE_ASSETS_DIR: /var/release-assets
      # Package registry blob store (D-PKG-07) — distinct from repos / LFS / release-assets.
      OCTANEST_PACKAGES_DIR: /var/packages
      OCTANEST_PACKAGES_MAX_BLOB_BYTES: ${OCTANEST_PACKAGES_MAX_BLOB_BYTES:-2147483648}
      OCTANEST_PACKAGES_OWNER_QUOTA_BYTES: ${OCTANEST_PACKAGES_OWNER_QUOTA_BYTES:-10737418240}
      # Git-over-SSH (GIT-03 / D-SSH-07): in-process russh; raw TCP — not Traefik.
      OCTANEST_SSH_ENABLED: ${OCTANEST_SSH_ENABLED:-true}
      OCTANEST_SSH_PORT: ${OCTANEST_SSH_PORT:-2222}
      # Advertised hostname for CloneBox / smoke (scp-style git@host:owner/repo.git).
      # Fallback: hostname of OCTANEST_PUBLIC_ORIGIN (Compose default localhost).
      OCTANEST_SSH_HOST: ${OCTANEST_SSH_HOST:-localhost}
      OCTANEST_SSH_HOST_KEY_DIR: ${OCTANEST_SSH_HOST_KEY_DIR:-/var/ssh}
    ports:
      # Host TCP publish for SSH (D-SSH-07) — do not add Traefik TCP/HTTP routers for SSH.
      - "2222:2222"
    volumes:
      # Avatar uploads (D-18) — api CWD is `/`, so bind to /var/uploads
      - ./var/uploads:/var/uploads
      # Bare repos (D-30 / D-38)
      - ./var/repos:/var/repos
      # Git LFS OID store (D-LFS-01) — instance-wide content-addressed objects
      - ./var/lfs:/var/lfs
      # Release assets volume (GIT-14 / D-REL-04) — distinct from LFS
      - ./var/release-assets:/var/release-assets
      # Package blobs (D-PKG-07) — content-addressed; not LFS or release-assets
      - ./var/packages:/var/packages
      # Persist SSH host keys across restarts (TOFU; D-SSH-07 / RESEARCH pitfall 5)
      - ssh_host_keys:/var/ssh
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=octanest_octanest
      # Smart HTTP (D-18 / D-22): /{owner}/{repo}.git → API before SPA catch-all (priority 110 > api 100 > web 1).
      - traefik.http.routers.api-git.rule=Host(`localhost`) && PathRegexp(`^/[^/]+/[^/]+\.git`)
      - traefik.http.routers.api-git.entrypoints=web
      - traefik.http.routers.api-git.priority=110
      - traefik.http.routers.api-git.service=api
      # Packages registry (D-PKG-01): /v2|/npm|/generic → API before SPA (priority 110).
      - traefik.http.routers.api-packages.rule=Host(`localhost`) && (PathPrefix(`/v2`) || PathPrefix(`/npm`) || PathPrefix(`/generic`))
      - traefik.http.routers.api-packages.entrypoints=web
      - traefik.http.routers.api-packages.priority=110
      - traefik.http.routers.api-packages.service=api
      - traefik.http.routers.api.rule=Host(`localhost`) && (PathPrefix(`/api`) || PathPrefix(`/uploads`) || Path(`/health`))
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.routers.api.priority=100
      - traefik.http.services.api.loadbalancer.server.port=8080
    networks:
      - octanest

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      PORT: "3000"
      # SSR Cookie-forward RPCs (bootstrap / session gate) — not 127.0.0.1 inside the container.
      OCTANEST_API_ORIGIN: http://api:8080
      # Browser-facing origin for SSR clone URLs (Traefik Host(localhost)).
      OCTANEST_PUBLIC_ORIGIN: ${OCTANEST_COMPOSE_PUBLIC_ORIGIN:-http://localhost}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Same shape as api /health — dedicated probe, not SSR `/` (avoids "Started" forever).
      # Requires Octanest-Health-Probe (public /health without header → 404).
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "-H",
          "Octanest-Health-Probe: 1",
          "http://127.0.0.1:3000/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=octanest_octanest
      - traefik.http.routers.web.rule=Host(`localhost`)
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.routers.web.priority=1
      - traefik.http.services.web.loadbalancer.server.port=3000
    networks:
      - octanest

networks:
  octanest:
    name: octanest_octanest

volumes:
  postgres_data:
  ssh_host_keys:
