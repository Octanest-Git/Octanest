# Slim local auth/email stubs — no cloud secrets required.
# Usage (alongside host `make dev`):
#   cp docs/dev-auth.env.example .env.dev-auth
#   make up-dev-auth
#   set -a && source .env.dev-auth && set +a
#   # then run API + web as usual
#
# Or: docker compose -f docker-compose.dev-auth.yml --profile dev-auth up -d
#
# Docs: docs/dev-auth.md

services:
  mailpit:
    profiles: ["dev-auth"]
    image: axllent/mailpit:v1.27
    ports:
      - "${OCTANEST_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${OCTANEST_MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - octanest-dev-auth

  oidc-mock:
    profiles: ["dev-auth"]
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - "${OCTANEST_OIDC_MOCK_PORT:-9090}:8080"
    environment:
      SERVER_PORT: "8080"
      LOG_LEVEL: info
      # Match grant_type (always in token body). Matching client_id fails when the
      # OIDC client uses HTTP Basic and omits client_id from the form — mock then
      # issues a JWT without `sub`, and openidconnect rejects the token response.
      JSON_CONFIG: |
        {
          "interactiveLogin": false,
          "httpServer": "NettyWrapper",
          "tokenCallbacks": [
            {
              "issuerId": "default",
              "tokenExpiry": 120,
              "requestMappings": [
                {
                  "requestParam": "grant_type",
                  "match": "authorization_code|.*",
                  "claims": {
                    "sub": "oidc-dev-user",
                    "aud": ["octanest-dev"],
                    "email": "oidc@octanest.local",
                    "email_verified": true,
                    "preferred_username": "oidcdev",
                    "name": "OIDC Dev"
                  }
                }
              ]
            }
          ]
        }
    networks:
      - octanest-dev-auth

  stubs:
    profiles: ["dev-auth"]
    build:
      context: ./scripts/dev-auth
      dockerfile: Dockerfile
    ports:
      - "${OCTANEST_STUBS_PORT:-9092}:9092"
    environment:
      PORT: "9092"
    networks:
      - octanest-dev-auth

networks:
  octanest-dev-auth:
    name: octanest_dev_auth
