# cargo-nextest — parallel, CI-friendly Rust test runner (faster than `cargo test`).
# https://nexte.st/docs/configuration/

[profile.default]
# Fail fast in local runs; CI uses --profile ci.
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci]
# Full suite on every PR; keep going so dialect/auth flakes are all visible.
fail-fast = false
slow-timeout = { period = "90s", terminate-after = 3 }
test-threads = "num-cpus"
