[package]
name = "octanest-runner"
description = "Octanest Actions self-hosted runner (custom JSON protocol)"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "octanest-runner"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.13.5", features = ["rustls", "json"], default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
