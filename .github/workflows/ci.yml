# Phase 1 quality gates — no production secrets (T-01-12).
# Prefer Bun via oven-sh/setup-bun; pnpm+Corepack is a documented fallback if Bun setup fails.

name: CI

on:
  push:
    # Include cursor/* so phase/integrate branches get hosted runners when
    # pull_request jobs fail to acquire runners (empty steps / runner_id 0).
    branches: [main, 'cursor/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-rust:
    name: api-rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: free disk for Rust link
        # ubuntu-latest fills quickly linking many debug integration binaries.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: install mold linker
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mold
      - name: cargo nextest
        # Full-workspace debug link has hit lld bus errors (signal 7) on GHA.
        # mold + modest job count + thinner debuginfo keeps link stable/disk-safe;
        # retry once on flake.
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
          CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: |
          cargo nextest run --workspace --profile ci \
            || cargo nextest run --workspace --profile ci

  web-octane:
    name: web-octane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: bun install
        run: bun install --frozen-lockfile
      - name: web lint (oxlint type-aware)
        run: bun run --filter @octanest/web lint
      - name: web format check (oxfmt)
        run: bun run --filter @octanest/web format:check
      - name: vitest (api-client + web unit/integration)
        run: bun run test
      - name: web build
        run: bunx turbo run build --filter=@octanest/web

  # G-11.1-15 — every user-facing apps/web route page must declare happy-dom,
  # stack-browser, or documented skip evidence in the route coverage manifest.
  route-coverage:
    name: route-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: route coverage gate
        run: make route-coverage-check

  # D-QH-02 weighted coverage gate (unit 25% / integration 40% / e2e checklist 35%).
  # Rust cargo-llvm-cov is Make-ready but skipped here (runtime/disk residual);
  # web Vitest + interim e2e checklist drive the score.
  coverage-weighted:
    name: coverage-weighted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: bun install
        run: bun install --frozen-lockfile
      - name: aggregator contract
        run: make coverage-contract
      - name: collect web coverage + weighted gate
        env:
          COVERAGE_WEIGHTED_FLOOR: "0.65"
        run: |
          make coverage-web
          ./scripts/coverage-e2e-checklist.sh | tee var/coverage/e2e-checklist.txt
          ./scripts/coverage-weighted.sh \
            --unit-json var/coverage/web-unit-summary.json \
            --integration-json var/coverage/web-integration-summary.json \
            --e2e-checklist | tee var/coverage/weighted.txt
      - name: upload coverage artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-weighted-logs
          path: |
            var/coverage/
            apps/web/coverage/
          if-no-files-found: ignore

  e2e-stack:
    name: e2e-stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: bun install
        run: bun install --frozen-lockfile
      - name: Playwright Chromium (stack browser e2e)
        run: bunx playwright install --with-deps chromium
      - name: stack e2e (API + Mailpit/OIDC/stubs + web)
        run: make test-e2e-stack
      - name: upload e2e logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-stack-logs
          path: var/e2e/
          if-no-files-found: ignore

  rpc-sync:
    name: rpc-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: bun install
        run: bun install --frozen-lockfile
      - name: check-rpc-sync
        run: make rpc-sync-check

  compose:
    name: compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: docker compose -f docker-compose.yml config
      - name: docker compose mysql overlay config
        run: docker compose -f docker-compose.yml -f docker-compose.mysql.yml --profile mysql config
      - name: docker compose sqlite overlay config
        run: docker compose -f docker-compose.yml -f docker-compose.sqlite.yml config
      - name: docker compose dev-auth stubs config
        run: docker compose -f docker-compose.dev-auth.yml --profile dev-auth config

  # D-QH-04: forge protocol smokes (Smart HTTP, SSH TCP, LFS routing, packages PathPrefix).
  # Fail-closed — docker-missing / stack-down must not greenwash (T-11.1-40).
  # Client ls-remote/LFS push remain optional (need seeded repo); routing+TCP are required.
  smoke-protocol:
    name: smoke-protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: forge protocol smokes
        env:
          CI: "true"
          SMOKE_REQUIRE_STACK: "1"
          SMOKE_SKIP_LS_REMOTE: "1"
          SMOKE_SKIP_LFS_CLIENT: "1"
        run: make smoke-protocol-ci # smoke-git-https smoke-git-ssh smoke-git-lfs smoke-packages
      - name: upload compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-protocol-logs
          path: |
            /tmp/octanest-smoke*.json
          if-no-files-found: ignore

  # Both Postgres and MySQL service containers boot on every matrix leg because
  # GitHub Actions cannot condition `services:` on `matrix.*`. Accepted cost on the sqlite leg.
  db-matrix:
    name: db-${{ matrix.dialect }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dialect: postgres
            database_url: postgres://octanest:octanest@localhost:5432/octanest
          - dialect: mysql
            database_url: mysql://octanest:octanest@127.0.0.1:3306/octanest
          - dialect: sqlite
            database_url: sqlite:./var/octanest.db
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: octanest
          POSTGRES_PASSWORD: octanest
          POSTGRES_DB: octanest
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U octanest" --health-interval=5s --health-timeout=5s --health-retries=10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: octanest
          MYSQL_PASSWORD: octanest
          MYSQL_DATABASE: octanest
          MYSQL_ROOT_PASSWORD: octanest
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -poctanest" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: migrate + probe (${{ matrix.dialect }})
        env:
          DATABASE_URL: ${{ matrix.database_url }}
          OCTANEST_DB_DIALECT: ${{ matrix.dialect }}
        run: cargo test -p octanest-db --test dialect_probe -- --nocapture
