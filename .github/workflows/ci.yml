# Phase 1 quality gates — no production secrets (T-01-12).
# Prefer Bun via oven-sh/setup-bun; pnpm+Corepack is a documented fallback if Bun setup fails.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace

  js:
    name: js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: bun install
        run: bun install --frozen-lockfile
      - name: vitest
        run: bun run --filter @octanest/api-client test
      - name: web build
        run: bunx turbo run build --filter=@octanest/web

  rpc-sync:
    name: rpc-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: bun install
        run: bun install --frozen-lockfile
      - name: check-rpc-sync
        run: make rpc-sync-check

  compose:
    name: compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: docker compose -f docker-compose.yml config
      - name: docker compose mysql overlay config
        run: docker compose -f docker-compose.yml -f docker-compose.mysql.yml --profile mysql config
