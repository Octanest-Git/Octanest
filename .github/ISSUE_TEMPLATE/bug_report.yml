name: Bug report
description: Something is not working in Oxidean (cloud, self-hosted, or local dev).
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security issues, do not file a public issue; see [SECURITY.md](https://github.com/oxidean/oxidean/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that triggers the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Where did you see this?
      description: Oxidean ships one codebase for Cloud and self-hosted, so this helps routing.
      options:
        - Oxidean Cloud (app.oxidean.dev)
        - Self-hosted (Docker Compose)
        - Self-hosted (other install)
        - Local development (make dev)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Git over SSH / Smart HTTP
        - Issues and comments
        - Releases and tags
        - Packages / registry
        - Git LFS
        - Web UI
        - API / RPC
        - Auth and accounts
        - Organizations and permissions
        - Repository mirroring
        - Actions / runners
        - Admin / setup
        - Documentation
        - Other
  - type: dropdown
    id: database
    attributes:
      label: Database (self-hosted only)
      options:
        - Not applicable / Oxidean Cloud
        - PostgreSQL
        - MySQL
        - SQLite
        - Not sure
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Image tag, release, or `git rev-parse HEAD` for local builds.
      placeholder: e.g. v0.1.0, latest compose image, or a commit SHA
  - type: textarea
    id: logs
    attributes:
      label: Logs and errors
      description: API logs, browser console output, or compose logs. Redact secrets, tokens, and cookies before pasting.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets, tokens, and personal data from logs and screenshots.
          required: true
